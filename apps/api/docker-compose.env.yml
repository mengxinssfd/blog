version: '3'
services:
  #  api:
  #    image: blog_api
  #    container_name: 'blog-api'
  #    networks:
  #      - blog_net
  #    ports:
  #      - '3000:3000'
  #    depends_on:
  #      - redis
  #      - mysql
  #  front:
  #    image: blog_front
  #    container_name: 'blog-front'
  #    networks:
  #      - blog_net
  #    ports:
  #      - '8080:8080'
  redis:
    image: redis:7
    ports:
      - '6379:6379'
    volumes:
      - ./tmp/redis/redis.conf:/etc/redis/redis.conf
      - ./tmp/redis/data:/data
    networks:
      - blog_net
    command: redis-server /etc/redis/redis.conf
    # 当启动报错：failed to create shim task: OCI runtime create failed: runc create failed: unable to start container process: err or during container init: error mounting
    # 可以用以下配置解决
    # security_opt:
    #   - seccomp:unconfined
  mysql:
    image: mysql:8.0
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: '123456'
      MYSQL_ALLOW_EMPTY_PASSWORD: 'no'
      MYSQL_DATABASE: 'blog'
      MYSQL_USER: 'admin'
      MYSQL_PASSWORD: '123456'
    ports:
      - '3306:3306'
    volumes:
      # 如何把别处导出的sql数据导入到docker内的数据库：
      # 1. 把导出的sql文件放入tmp/mysql文件夹（因为使用了卷，会出现在docker容器内）
      # 2. 使用docker desktop或者cli进入'api-mysql-1'(或api_mysql_1)容器内
      # 3. 打开sql文件目录 `cd /var/lib/mysql`
      # 4. 进入mysql `mysql -uroot -p123456`
      # 5. 把database改为blog `use blog;`
      # 6. 导入sql `source 文件名.sql;`
      - ./tmp/mysql:/var/lib/mysql
    networks:
      - blog_net
    command: --default-authentication-plugin=mysql_native_password #解决外部无法访问
  mysql_e2e:
    image: mysql:8.0
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: '123456'
      MYSQL_ALLOW_EMPTY_PASSWORD: 'no'
      MYSQL_DATABASE: 'blog'
      MYSQL_USER: 'admin'
      MYSQL_PASSWORD: '123456'
    ports:
      - '3307:3306'
    networks:
      - blog_net
    command: --default-authentication-plugin=mysql_native_password #解决外部无法访问

networks:
  # 相当于 docker network create blog_net
  blog_net:
